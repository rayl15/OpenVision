name: OpenVision
options:
  bundleIdPrefix: com.openvision
  # Bumped 16 → 18 for the on-device Gemma 4 (MLX) backend, which needs iOS 18 at runtime.
  # Revert to 16 + gate GemmaLocalService behind `if #available(iOS 18)` to keep older support.
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "2.7.0"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: OpenVision/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: ${PRODUCT_BUNDLE_IDENTIFIER}
    META_APP_ID: ${META_APP_ID}
    CLIENT_TOKEN: ${CLIENT_TOKEN}
    APP_LINK_URL_SCHEME: ${APP_LINK_URL_SCHEME}

configs:
  Debug:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  Release:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  OpenVision:
    type: application
    platform: iOS
    sources:
      - path: OpenVision
        excludes:
          - "**/*.example"
    resources:
      - path: OpenVision/Resources
        excludes:
          - "**/*.plist"
    settings:
      base:
        INFOPLIST_FILE: OpenVision/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
        CODE_SIGN_ENTITLEMENTS: OpenVision/OpenVision.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: OpenVision/OpenVision-Bridging-Header.h
    dependencies:
      - package: meta-wearables-dat-ios
        products:
          - MWDATCore
          - MWDATCamera
      # On-device Gemma 4 (Local backend). MLX/MLXNN resolve transitively via these products.
      - package: mlx-swift-lm
        products:
          - MLXLLM           # text LLMs (Qwen 2.5, Gemma 2) via LLMModelFactory
          - MLXVLM           # vision models (Gemma 4, SmolVLM2) via VLMModelFactory
          - MLXLMCommon
          - MLXHuggingFace   # #hubDownloader() / #huggingFaceTokenizerLoader()
      # The macros above expand to HuggingFace.HubClient + Tokenizers.AutoTokenizer; mlx-swift-lm
      # deliberately doesn't depend on these, so the consumer supplies them (same as OpenGlasses).
      - package: swift-huggingface
        products:
          - HuggingFace
      - package: swift-transformers
        products:
          - Tokenizers
      # On-device neural TTS (Kokoro).
      - package: KokoroSwift
        product: KokoroSwift
    preBuildScripts:
      - name: "Check Config Files"
        script: |
          if [ ! -f "${PROJECT_DIR}/Config.xcconfig" ]; then
            echo "error: Config.xcconfig not found. Copy Config.xcconfig.example to Config.xcconfig"
            exit 1
          fi
        basedOnDependencyAnalysis: false

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    # Pinned: 0.7.0+ renamed StreamSession -> Stream/DeviceSession and 0.6.0 made its init
    # inaccessible. GlassesManager targets the original 0.4.0 API (was `from: 0.4.0`, which
    # floated to 0.8.0 and broke the build after 4 months of SDK drift).
    exactVersion: "0.4.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: "3.31.3"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: "0.1.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: "1.0.0"
  # On-device neural TTS (Kokoro-82M) via MLX Swift — VENDORED under Vendor/ for full visibility
  # and reproducibility (source frozen in-repo, not pulled live). Shares mlx-swift with mlx-swift-lm.
  KokoroSwift:
    path: Vendor/kokoro-ios

schemes:
  OpenVision:
    build:
      targets:
        OpenVision: all
    run:
      config: Debug
      commandLineArguments:
        "-FIRDebugEnabled": false
    test:
      config: Debug
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
